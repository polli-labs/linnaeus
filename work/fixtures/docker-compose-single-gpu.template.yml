# Profiling Trial Docker Compose Template - Single GPU
# This template is specifically designed for use with run_profiling_trials.py
# Variables will be substituted by the profiling wrapper tool

networks:
  default:
    name: blade_polli

services:
  linnaeus-training:
    image: frontierkodiak/linnaeus-dev:${IMAGE_TAG:-ampere-0.1.5}
    pull_policy: always
    runtime: nvidia
    shm_size: 16G
    restart: "no"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - CONFIG_DIR=/configs
    volumes:
      # Bind mounts as specified in experiment config
      - /peach/generated:/data_hot
      - /general/generated:/data_cold
      - /datasets/modelZoo/polliFormer:/modelZoo
      - /datasets/modelWorkshop:/modelWorkshop
      - /home/caleb/repo/linnaeus:/app/linnaeus
      - /home/caleb/repo/linnaeus/configs:/configs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /app/linnaeus
    command: >
      bash -c "
        echo 'Starting profiling trial for branch: {{GIT_REF}} @ {{COMMIT_HASH}}' &&
        git config --global --add safe.directory /app/linnaeus &&
        if [ -d '.git' ]; then
          echo 'Updating linnaeus to {{GIT_REF}}...';
          git fetch --quiet origin {{GIT_REF}};
          git checkout --force FETCH_HEAD;
          {{COMMIT_RESET_CMD}}
          echo 'Linnaeus updated to: ' \$(git rev-parse HEAD);
        else
          echo 'Warning: Not a git repository. Skipping update.';
        fi &&
        python3 -m linnaeus.main --cfg {{CONFIG_FILE}}{{OPTS_STRING}}
      "
    tty: true
    stdin_open: true