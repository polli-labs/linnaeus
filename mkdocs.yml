site_name: Polli Linnaeus
site_description: "An open-source deep learning framework for taxonomic image classification."
repo_url: https://github.com/polli-labs/linnaeus

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
  logo: https://assets.polli.ai/docs-brand/latest/wordmarks/linnaeus.svg
  logo_dark: https://assets.polli.ai/docs-brand/latest/wordmarks/linnaeus.svg
extra_css:
  - https://assets.polli.ai/docs-brand/latest/polli-brand.css
extra_javascript:
  - https://assets.polli.ai/docs-brand/latest/polli-brand.js

