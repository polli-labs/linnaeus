[project]
name = "linnaeus"
version = "0.4.0"
description = "Linnaeus: A deep learning framework for taxonomic recognition."
## Releasing
# When releasing a new version:
# 1. Update the version above
# 2. Tag with proper format: vX.Y.Z for stable, vX.Y.Z-rcN for pre-releases (note the hyphen!)
# 3. Ensure base Docker images are up-to-date before tagging
authors = [
    { name = "Caleb Sowers", email = "caleb@polli.ai" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core ML stack (torch/vision/audio are optional via extras: cpu/cuda)
    "kornia>=0.8.1,<0.9",

    # Utilities
    "yacs>=0.1.8",
    "numpy>=1.20",
    "tqdm",
    "h5py",
    "wandb",
    "pyyaml",
    "albumentations>=1.4.0",
    "Pillow",
    "opencv-python-headless>=4.9.0",
    "pandas",
    "matplotlib",
    "termcolor",
    "rich",
    "polli-typus>=0.1.10",
    "huggingface-hub",
    "python-dateutil",
]

[project.scripts]
linnaeus-prof = "linnaeus.profiling.cli:main"
linnaeus-prof-run = "linnaeus.tools.profiling.run_profiling_trials:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty",
    "mkdocs",
    "mkdocs-material",
]
cpu = [
    # Core ML stack — keep the three in sync
    "torch>=2.7.1,<2.8",
    "torchvision>=0.22.1",
    "torchaudio>=2.7.1",
]
cuda = [
    # GPU-only stack (Linux/x86_64)
    "torch>=2.7.1,<2.8 ; (sys_platform=='linux' and platform_machine=='x86_64')",
    "torchvision>=0.22.1 ; (sys_platform=='linux' and platform_machine=='x86_64')",
    "torchaudio>=2.7.1 ; (sys_platform=='linux' and platform_machine=='x86_64')",
]
triton = [
    "triton>=2.1.0",
]
inference = [
    "litserve",
    "polli-typus>=0.1.10",
    "uvicorn[standard]",
    "pydantic",
]
profiling = [
    "tensorboard",
    "torch-tb-profiler", 
    "pyyaml>=6.0",  # For trial configuration files
    "rich>=13.0",   # For pretty console output in profiling runner
]

cuda-fa = [
    # Note: flash-attn is an optional dependency for GPU environments.
    # It is handled automatically in the official Docker images.
    "flash-attn>=2.7.4.post1 ; (sys_platform=='linux' and platform_machine=='x86_64')"
]

rl = [
    "gymnasium>=0.29.1",
]

all = [
  # re-export everything so 'uv pip install .[all]' pulls it in one go.
  # CPU is included by default; CUDA remains opt-in via linnaeus[cuda].
  "linnaeus[dev]",
  "linnaeus[cpu]",
  "linnaeus[inference]",
  "linnaeus[profiling]",
  "linnaeus[rl]",
]

[project.urls]
Homepage = "https://github.com/polli-labs/linnaeus"
Issues = "https://github.com/polli-labs/linnaeus/issues"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]
no-build-isolation-package = ["flash-attn"]
no-binary-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
flash-attn = [
  { git = "https://github.com/Dao-AILab/flash-attention.git", tag = "v2.7.4.post1", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

# Build system uses hatchling for modern, deterministic builds.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit package discovery for Hatchling.
[tool.hatch.build.targets.wheel]
packages = ["linnaeus"]

# ---------------------------------------------------------------------------
# Ruff -- relaxed baseline
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 140                 # allow moderately long research strings
target-version = "py310"
respect-gitignore = true          # skip data/output folders already ignored
include = ["linnaeus/**/*.py"]    # only check files in linnaeus module
exclude = [
    "work/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
    "setup/**/*.py",
    "archive/**/*.py",
    "configs/**/*.py",
]

[tool.ruff.format]                # formatter runs first; low-stress defaults
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = true  # avoids giant diffs on dict / param lists
line-ending = "auto"

[tool.ruff.lint]
select  = ["E", "F", "W", "UP", "B"]   # core error classes + bugbear safety
extend-select = ["I"]                  # import-sorter (zero-config, low noise)
ignore  = [
  "E501",   # line too long         (handled implicitly by formatter)
  "E741",   # ambiguous variable names (too noisy on legacy code)
  "B008",   # dict/list default values in function defs (acceptable for now)
]
# Temporarily silence whole rule‐groups that dominate the current noise floor
extend-ignore = [
  "ANN",    # missing type-hints
  "C4",     # inconsistent comprehensions
  "TCH",    # typing-only imports
  "ASYNC",  # async-specific suggestions
  "D",      # docstring style/format
]

[tool.ruff.lint.mccabe]
max-complexity = 20               # pragmatic ceiling; revisit once stable

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # re-export patterns & late imports are fine
"tests/**/*.py" = ["I", "F401"]   # test util imports & order don't matter yet

[tool.ruff.lint.isort]
split-on-trailing-comma = false    # align with formatter's skip-magic-trailing-comma
