name: quality-gate

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --extra dev --extra cpu

      - name: Run quality gate
        run: uv run python tools/quality_gate.py

