name: Build and Publish Linnaeus

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-images:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: turing
            base_image_tag: turing-cu126
            dockerfile_args: '--build-arg TORCH_CHANNEL=stable --build-arg TORCH_VER=2.7.1+cu126 --build-arg TORCH_CUDA_SUFFIX=cu126 --build-arg CUDA_ARCH_LIST="7.5" --build-arg FA_VER=""'
          - arch: ampere
            base_image_tag: ampere-cu126
            dockerfile_args: '--build-arg TORCH_CHANNEL=stable --build-arg TORCH_VER=2.7.1+cu126 --build-arg TORCH_CUDA_SUFFIX=cu126 --build-arg CUDA_ARCH_LIST="8.0;8.6" --build-arg FA_VER=2.7.4.post1'
          - arch: hopper
            base_image_tag: hopper-cu128-nightly
            dockerfile_args: '--build-arg TORCH_CHANNEL=nightly --build-arg TORCH_CUDA_SUFFIX=cu128 --build-arg CUDA_ARCH_LIST="9.0"'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: frontierkodiak/linnaeus-dev
          tags: |
            type=semver,pattern={{version}},prefix=${{ matrix.arch }}-
            type=raw,value=${{ matrix.arch }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./tools/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: ${{ matrix.dockerfile_args }}
          cache-from: type=registry,ref=frontierkodiak/linnaeus-base:${{ matrix.base_image_tag }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-docs:
    name: Deploy Docs to VPS
    runs-on: ubuntu-latest
    needs: build-images
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -U pip
          pip install mkdocs mkdocs-material
      - run: mkdocs build
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.POLLISERVE0_SSH_PRIVATE_KEY }}
      - run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            site/ ${{ secrets.POLLISERVE0_SSH_USER }}@${{ secrets.POLLISERVE0_SSH_PUBLIC_HOST }}:/var/www/docs.polli.ai/html/linnaeus/
