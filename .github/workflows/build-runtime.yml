name: Build Runtime Images

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-runtime:
    name: Build Runtime Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: turing
            base_tag: turing-cu126
          - arch: ampere
            base_tag: ampere-cu126
          - arch: hopper
            base_tag: hopper-cu128-nightly
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Reserve 3GB for BuildKit to prevent aggressive garbage collection
          # This ensures GitHub's 14GB runners have ~11GB usable space
          driver-opts: |
            env.BUILDKIT_GC_KEEP_STORAGE=3g
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: frontierkodiak/linnaeus-dev
          tags: |
            type=semver,pattern={{version}},prefix=${{ matrix.arch }}-
            type=raw,value=${{ matrix.arch }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=${{ matrix.arch }}-
            type=sha,prefix=${{ matrix.arch }}-,format=short
      
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/docker/Dockerfile.runtime
          # IMPORTANT: Must match the stage name in Dockerfile.runtime (FROM ... AS runtime)
          # This prevents BuildKit from evaluating unused stages that would exceed disk limits
          target: runtime
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ matrix.base_tag }}
            LINNAEUS_REF=${{ github.ref_name }}
          pull: true
          cache-from: type=registry,ref=frontierkodiak/linnaeus-base:${{ matrix.base_tag }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      
      - name: Check BuildKit tmp size
        # Monitors BuildKit's temporary storage to ensure we stay within GitHub's disk limits
        # We measure BuildKit's tmp dir (not /) for accurate usage after the slim base design
        run: |
          # Get BuildKit's tmp directory and measure its size
          buildkit_dir=$(docker buildx du 2>/dev/null | awk '/buildkit/{print $2}' | head -1)
          if [ -n "$buildkit_dir" ] && [ -d "$buildkit_dir" ]; then
            used=$(du -BG -s "$buildkit_dir" 2>/dev/null | awk '{print $1}' | tr -d 'G')
          else
            # Fallback to /tmp if buildkit dir not found
            used=$(du -BG -s /tmp 2>/dev/null | awk '{print $1}' | tr -d 'G')
          fi
          echo "BuildKit tmp: ${used}GB"
          if [ "$used" -gt 12 ]; then
            echo "::error title=BuildKit tmp too large::${used}GB used; limit is 12GB"
            exit 1
          fi