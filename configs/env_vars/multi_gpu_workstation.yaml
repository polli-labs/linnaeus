# Multi-GPU Workstation Environment Variables
# Optimized for multi-GPU training on workstation hardware (PCIe P2P)

BLAS:
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  TBB_NUM_THREADS: 1
  OPENCV_NUM_THREADS: 1
  HDF5_USE_THREADS: 0

TORCH:
  TORCH_INTRAOP_NUM_THREADS: 4
  TORCH_INTEROP_NUM_THREADS: 2
  TORCH_COMPILE_DISABLE: 1

CUDA:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:true,rounding:32m"

NCCL:
  NCCL_IB_DISABLE: 1
  NCCL_P2P_DISABLE: 0
  NCCL_P2P_LEVEL: "PXB"
  NCCL_BLOCKING_WAIT: 1
  NCCL_ALGO: "Ring,Tree"
  NCCL_MIN_NCHANNELS: 4
  NCCL_MAX_NCHANNELS: 4
  NCCL_TOPO_DUMP_FILE: "/tmp/nccl_graph.xml"

DEBUG:
  TORCH_DISTRIBUTED_DEBUG: "WARN"