# DGX H100 Environment Variables
# Optimized for high-performance multi-GPU training with NVLink-Switch

BLAS:
  OMP_NUM_THREADS: 4
  MKL_NUM_THREADS: 4
  OPENBLAS_NUM_THREADS: 4
  TBB_NUM_THREADS: 4
  OPENCV_NUM_THREADS: 2
  HDF5_USE_THREADS: 0

TORCH:
  TORCH_INTRAOP_NUM_THREADS: 8
  TORCH_INTEROP_NUM_THREADS: 4
  TORCH_COMPILE_DISABLE: 0

CUDA:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:true,rounding:64m"
  CUDA_DEVICE_MAX_CONNECTIONS: 1

NCCL:
  NCCL_IB_DISABLE: 0
  NCCL_NVLS_ENABLE: 1
  NCCL_COLLNET_ENABLE: 1
  NCCL_ALGO: "Tree,Ring"
  NCCL_BLOCKING_WAIT: 0
  NCCL_MIN_NCHANNELS: 8
  NCCL_MAX_NCHANNELS: 16
  NCCL_P2P_DISABLE: 0
  NCCL_P2P_LEVEL: "NVL"
  NCCL_NET_GDR_LEVEL: 2
  NCCL_TOPO_DUMP_FILE: "/tmp/nccl_dgx_h100.xml"

DEBUG:
  TORCH_DISTRIBUTED_DEBUG: "DETAIL"