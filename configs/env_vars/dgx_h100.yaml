# DGX H100 Environment Variables
# Optimized for high-performance multi-GPU training with NVLink-Switch
#
# USAGE:
#   This file provides environment variable defaults via ENV.SCENARIO=dgx_h100
#   or via env_yaml parameter in profiling trials.
#
# MERGE ORDER:
#   1. Base scenario defaults (loaded by env_ctrl.py)
#   2. This YAML file (if specified via env_yaml)
#   3. Runtime environment variables (highest precedence)
#
# INTENDED USE:
#   - DGX H100 systems with 8 GPUs
#   - High-speed NVLink/NVSwitch interconnect
#   - Large-scale distributed training and production workloads

BLAS:
  OMP_NUM_THREADS: 4
  MKL_NUM_THREADS: 4
  OPENBLAS_NUM_THREADS: 4
  TBB_NUM_THREADS: 4
  OPENCV_NUM_THREADS: 2
  HDF5_USE_THREADS: 0

TORCH:
  TORCH_INTRAOP_NUM_THREADS: 8
  TORCH_INTEROP_NUM_THREADS: 4
  TORCH_COMPILE_DISABLE: 0

CUDA:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:true"
  CUDA_DEVICE_MAX_CONNECTIONS: 1

NCCL:
  NCCL_IB_DISABLE: 0
  NCCL_NVLS_ENABLE: 1
  NCCL_COLLNET_ENABLE: 1
  NCCL_ALGO: "Tree,Ring"
  NCCL_BLOCKING_WAIT: 0
  NCCL_MIN_NCHANNELS: 8
  NCCL_MAX_NCHANNELS: 16
  NCCL_P2P_DISABLE: 0
  NCCL_P2P_LEVEL: "NVL"
  NCCL_NET_GDR_LEVEL: 2
  NCCL_TOPO_DUMP_FILE: "/tmp/nccl_dgx_h100.xml"

DEBUG:
  TORCH_DISTRIBUTED_DEBUG: "DETAIL"