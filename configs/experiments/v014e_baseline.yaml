# v0.1.4e Baseline Configuration
# Uses new v0.1.4e code with Kornia integration and fixed logging,
# but with torch.compile DISABLED for baseline measurement

BASE: ['configs/experiments/generic_mformer_example.yaml']

EXPERIMENT:
  NAME: 'v014e_baseline'
  GROUP: 'v014'
  TAGS: ['v014e', 'baseline', 'kornia', 'profiling']
  CODE_VERSION: 'v0.1.4e'

# Enable profiling with GPU synchronization for accurate measurements
DEBUG:  
  PROFILER:
    ENABLED: True
    SYNC_PROFILING: True

# Augmentation configuration - Kornia-based pipeline with compilation DISABLED
AUG:
  PIPELINE_DEVICE: "gpu"
  GPU_COMPILE:
    ENABLED: False
    BACKEND: "inductor" 
    MODE: "default"
  AUTOAUG:
    POLICY: "original"
    COLOR_JITTER: 0.4
  RANDOM_ERASE:
    PROB: 0.25
    AREA_RANGE: [0.02, 0.4]
    ASPECT_RATIO: [0.3, 3.3]

# Override training duration for profiling
TRAIN:
  EPOCHS: 1

# Override batch size for consistent profiling
DATA:
  BATCH_SIZE: 64
  BATCH_SIZE_VAL: 64